<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>내 버츄얼 캐릭터 얼굴 트래킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen stage. Title top-left, the illustration fills the middle, controls docked at the bottom. */
:root{
  --bg:#f3effa;
  --stage-top:#ffffff;
  --stage-bottom:#e7def6;
  --surface:#ffffff;
  --ink:#2a2140;
  --muted:#6a5f85;
  --line:#d6cbea;
  --accent:#6d3fc4;
  --accent-ink:#ffffff;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111f; --stage-top:#2a2140; --stage-bottom:#1c1630; --surface:#231c36;
    --ink:#efe9fb; --muted:#b1a6cc; --line:#3a2f57; --accent:#b594f5; --accent-ink:#1b1230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111f; --stage-top:#2a2140; --stage-bottom:#1c1630; --surface:#231c36;
  --ink:#efe9fb; --muted:#b1a6cc; --line:#3a2f57; --accent:#b594f5; --accent-ink:#1b1230;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:16px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;line-height:1.1}
header p{margin:0;color:var(--muted);font-size:14px}
.stage{position:relative;flex:1;min-height:260px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));border:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:center}
#view{display:block;flex:none;touch-action:none}
.cam{cursor:pointer;position:absolute;left:12px;bottom:12px;z-index:2;width:88px;height:66px;object-fit:cover;border-radius:12px;
  border:2px solid var(--surface);transform:scaleX(-1);background:#000}
.controls{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-family:var(--font-display);color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 6px;min-height:46px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.talk{display:flex;gap:8px;flex-wrap:wrap}
.talk button{flex:1 1 140px;font-size:16px}
.talk button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{margin:0;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>내 버츄얼 캐릭터</h1>
    <p>얼굴·손 트래킹 · c6</p>
  </header>

  <div class="stage">
    <video class="cam" id="cam" playsinline muted hidden></video>
    <canvas id="view" width="1185" height="1327" role="img" aria-label="은빛 긴 머리에 보라색 드레스를 입은 캐릭터"></canvas>
  </div>

  <div class="controls">
    <div class="talk">
      <button type="button" id="camBtn">카메라 켜기</button>
      <button type="button" id="hold">누르고 있으면 말해요</button>
      <button type="button" id="swapBtn">손 좌우 바꾸기</button>
    </div>
    <p class="hint" id="hint">카메라를 켜면 캐릭터가 내 표정, 고개, 몸, 손 움직임을 따라 해요. 영상은 기기 밖으로 나가지 않아요.</p>
    <p class="hint" id="trackStatus" hidden></p>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vP;
uniform vec2 uRes;
void main(){
  vP = vec2((aPos.x * 0.5 + 0.5) * uRes.x, (0.5 - aPos.y * 0.5) * uRes.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vP;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform vec3 uHead;   // x: turn (-1..1), y: nod (-1..1), z: tilt in radians
uniform vec2 uLid;    // openness of the screen-left and screen-right eye, 0..1
uniform vec2 uMouth;  // x: open 0..1, y: smile 0..1
uniform vec2 uIris;   // gaze, -1..1
uniform float uBreath;
uniform float uTime;
uniform float uSwing;
uniform vec4 uBody;   // x: lean (-1..1), y: shoulder tilt in radians, z: up/down (-1..1), w: near/far (-1..1)

// Eyelid as a curtain: skin above the lash line stretches down and carries the lashes over a still eyeball.
vec2 eye(vec2 q, float xc, float a, float yt0, float lashH, float yb0, float open){
  float t = (q.x - xc) / a;
  float t2 = t * t;
  if (t2 >= 1.0) return q;
  float yt = yt0 + 14.0 * t2;
  float yb = yb0 - 14.0 * t2;
  float gap = max(0.0, yb - yt - lashH);
  float D = (1.0 - open) * gap;
  float m = 26.0;
  float top = yt - m;
  if (q.y > top && q.y < yt + D){
    q.y = top + (q.y - top) * m / (m + D);
  } else if (q.y >= yt + D && q.y < yt + D + lashH){
    q.y -= D;
  } else if (q.y >= yt + D + lashH && q.y < yb + 3.0){
    float yc = (yt + lashH + yb) * 0.5;
    float ty = (q.y - yc) / (gap * 0.5 + 3.0);
    float by = clamp(1.0 - ty * ty, 0.0, 1.0) * (1.0 - t2);
    q.x -= uIris.x * 5.0 * by;
    q.y -= uIris.y * 3.0 * by;
  }
  return q;
}

void main(){
  vec2 p = vP;

  // body: lean closer or away, bob, bend at the waist, tilt the shoulders. The bottom edge stays put.
  vec2 foot = vec2(619.0, uRes.y);
  p = foot + (p - foot) / (1.0 + uBody.w * 0.06);
  p.y -= uBody.z * 16.0 * (1.0 - smoothstep(600.0, uRes.y, p.y));
  p.x -= uBody.x * 60.0 * (1.0 - smoothstep(350.0, 1150.0, p.y));
  float bw = 1.0 - smoothstep(850.0, 1250.0, p.y);
  float ba = -uBody.y * bw;
  vec2 bd = p - vec2(619.0, 1000.0);
  float bc = cos(ba), bs = sin(ba);
  p = vec2(619.0, 1000.0) + vec2(bd.x * bc - bd.y * bs, bd.x * bs + bd.y * bc);

  // breathing: the upper body rises and falls a little, the bottom edge stays put
  p.y += uBreath * 3.0 * (1.0 - smoothstep(700.0, uRes.y, p.y));

  // long hair at the sides sways and trails behind the head
  float hw = smoothstep(480.0, 950.0, p.y) * smoothstep(190.0, 330.0, abs(p.x - 619.0));
  p.x += (sin(uTime * 1.3 + p.y * 0.008) * 3.5 + uSwing * 16.0) * hw;

  // head: tilt around the neck, then a soft bulge so the face shifts more than the outline (turn / nod)
  float w = 1.0 - smoothstep(430.0, 570.0, p.y);
  vec2 piv = vec2(619.0, 485.0);
  float ang = -uHead.z * w;
  vec2 d = p - piv;
  float cs = cos(ang), sn = sin(ang);
  p = piv + vec2(d.x * cs - d.y * sn, d.x * sn + d.y * cs);
  vec2 fd = (p - vec2(619.0, 345.0)) / vec2(175.0, 195.0);
  float fb = exp(-dot(fd, fd));
  p.x -= uHead.x * (24.0 * fb + 9.0) * w;
  p.y -= uHead.y * (15.0 * fb + 5.0) * w;

  // eyes
  p = eye(p, 535.0, 43.0, 310.0, 12.0, 349.0, uLid.x);
  p = eye(p, 695.0, 45.0, 306.0, 13.0, 346.0, uLid.y);

  // mouth: lower lip drops, the gap shows the inside of the mouth
  float ym = 427.0, xm = 621.0, lipH = 11.0, fall = 40.0;
  float mt = (p.x - xm) / 25.0;
  float mb = clamp(1.0 - mt * mt, 0.0, 1.0);
  float G = uMouth.x * 18.0 * mb;
  float inside = 0.0;
  float insideY = 0.0;
  // corners lift when smiling
  float cx = abs(p.x - xm) - 24.0;
  p.y += uMouth.y * 5.0 * exp(-(cx * cx) / 160.0) * exp(-((p.y - ym) * (p.y - ym)) / 220.0);
  if (G > 0.01 && p.y >= ym && p.y < ym + fall){
    if (p.y < ym + G){
      inside = smoothstep(0.0, 1.5, p.y - ym) * smoothstep(0.0, 1.5, ym + G - p.y);
      insideY = (p.y - ym) / max(G, 0.001);
      p.y = ym;
    } else if (p.y < ym + G + lipH){
      p.y -= G;
    } else {
      p.y = ym + lipH + (p.y - ym - G - lipH) * (fall - lipH) / (fall - lipH - G);
    }
  }

  vec4 c = vec4(0.0);
  if (p.x >= 0.0 && p.x <= uRes.x && p.y >= 0.0 && p.y <= uRes.y) c = texture2D(uTex, p / uRes);
  vec3 mouthCol = mix(vec3(0.36, 0.13, 0.20), vec3(0.86, 0.47, 0.52), smoothstep(0.55, 0.95, insideY));
  c = mix(c, vec4(mouthCol, 1.0), inside);
  gl_FragColor = c;
}
</script>

<script id="vs2" type="x-shader/x-vertex">
attribute vec2 aPos;
uniform vec4 uRect;   // part rectangle in arm-local pixels: x, y, w, h
uniform mat3 uM;      // arm-local pixels -> picture pixels
uniform vec4 uUV;     // the part's rectangle in the atlas, 0..1
uniform vec2 uRes;
varying vec2 vT;
void main(){
  vec2 q = aPos * 0.5 + 0.5;
  q.y = 1.0 - q.y;
  vec3 c = uM * vec3(uRect.xy + q * uRect.zw, 1.0);
  vT = uUV.xy + q * uUV.zw;
  gl_Position = vec4(c.x / uRes.x * 2.0 - 1.0, 1.0 - c.y / uRes.y * 2.0, 0.0, 1.0);
}
</script>
<script id="fs2" type="x-shader/x-fragment">
precision mediump float;
varying vec2 vT;
uniform sampler2D uTex2;
void main(){ gl_FragColor = texture2D(uTex2, vT); }
</script>

      var handAng = armAng + clamp(wrap(h.ang - armAng), -0.95, 0.95);
      var base = function(t){ return mul(mul(mul(tr(px, py), rot(t)), scl(HAND_SCALE, HAND_SCALE)), scl(h.side ? -1 : 1, 1)); };
      // turning the hand over: it narrows, flips, and shows the palm-side artwork
      var palmSide = h.face < 0, turnX = (palmSide ? -1 : 1) * Math.max(0.14, Math.abs(h.face));
      var H = mul(base(handAng), scl(turnX, 1));
      // a second copy of the sleeve further down the arm, so the arm is long enough to reach the face
      drawPart("arm", mul(base(armAng), tr(0, -ARM_EXTRA)));
      drawPart("palm", H, palmSide);
      FINGERS.forEach(function(nm, idx){
        var p = HAND.parts[nm], s = 1 - 0.58 * clamp(h.curl[idx], 0, 1);
        var F = mul(H, tr(p.piv[0], p.piv[1]));
        F = mul(F, rot(h.spread[idx] + p.rest)); F = mul(F, scl(1, s)); F = mul(F, rot(-p.rest));
        F = mul(F, tr(-p.piv[0], -p.piv[1]));
        drawPart(nm, F, palmSide);
      });
      drawPart("arm", base(armAng));
    });
  }

  // ---------- frame loop ----------
  function frame(now){
    var t = now / 1000;
    track(now);
    var live = camOn && now - lastFace < 800;
    video.style.borderColor = live ? "#8f5cf0" : "";

    if (live){ target.x = rig.yaw; target.y = rig.pitch; }
    else if (now - lastPointer > 2500){
      target.x = calm ? 0 : Math.sin(t * 0.5) * 0.35;
      target.y = calm ? 0 : Math.sin(t * 0.37) * 0.2;
    }
    var ease = live ? 0.45 : 0.1;
    look.x += (target.x - look.x) * ease;
    look.y += (target.y - look.y) * ease;

    var rollDeg = live ? rig.roll * 0.6 : look.x * 4;
    slowX += (look.x + rollDeg / 18 - slowX) * 0.06;
    swing += ((slowX - (look.x + rollDeg / 18)) - swing) * 0.2;

    // blink on its own while the camera is off
    if (blinkStart < 0 && now > blinkAt) blinkStart = now;
    var auto = 1;
    if (blinkStart >= 0){
      var bp = (now - blinkStart) / 160;
      if (bp >= 1){ blinkStart = -1; blinkAt = now + 1800 + Math.random() * 3200; }
      else auto = Math.abs(1 - bp * 2);
    }
    var lidL = live ? rig.lidL : auto, lidR = live ? rig.lidR : auto;

    var idle = calm ? 0 : Math.sin(t * 0.6) * 0.08;
    var bx = live ? rig.bodyX + rig.yaw * 0.25 : look.x * 0.35 + idle;
    var bt = live ? rig.roll * 0.2 + rig.bodyX * 3 : look.x * 1.5 + idle * 6;
    body.x += (clamp(bx, -1, 1) - body.x) * 0.18;
    body.tilt += (bt - body.tilt) * 0.18;
    body.y += ((live ? rig.bodyY : 0) - body.y) * 0.18;
    body.z += ((live ? rig.bodyZ : 0) - body.z) * 0.15;

    var goal = holding ? 0.25 + 0.75 * Math.abs(Math.sin(t * 13) * Math.sin(t * 5.3 + 1)) : 0;
    talk += (goal - talk) * 0.35;
    var mouth = Math.max(talk, live ? rig.jaw : 0);
    var smile = live ? rig.smile : 0;
    var yaw = look.x, pitch = look.y, irisX = live ? rig.irisX : look.x * 0.6, irisY = live ? rig.irisY : look.y * 0.6;

    if (pose){
      yaw = pose[0] || 0; pitch = pose[1] || 0; rollDeg = pose[2] || 0;
      lidL = pose[3] == null ? 1 : pose[3]; lidR = pose[4] == null ? 1 : pose[4];
      mouth = pose[5] || 0; smile = pose[6] || 0; irisX = yaw; irisY = pitch; swing = 0;
      body.x = pose[7] || 0; body.tilt = pose[8] || 0; body.y = pose[9] || 0; body.z = pose[10] || 0;
    }

    if (ready){
      fit();
      gl.useProgram(prog);
      gl.disable(gl.BLEND);
      gl.uniform3f(U.uHead, yaw, pitch, rollDeg * Math.PI / 180);
      gl.uniform2f(U.uLid, clamp(lidL, 0, 1), clamp(lidR, 0, 1));
      gl.uniform2f(U.uMouth, clamp(mouth, 0, 1), clamp(smile, 0, 1));
      gl.uniform2f(U.uIris, clamp(irisX, -1, 1), clamp(irisY, -1, 1));
      gl.uniform1f(U.uBreath, calm || pose ? 0 : Math.sin(t * 1.8));
      gl.uniform1f(U.uTime, calm || pose ? 0 : t);
      gl.uniform1f(U.uSwing, clamp(swing, -1, 1));
      gl.uniform4f(U.uBody, body.x, body.tilt * Math.PI / 180, body.y, body.z);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (handReady) drawHands(now);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
